<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="找回密码 - 福溪村官网">
  <meta name="keywords" content="福溪村,找回密码">
  <title>找回密码 - 福溪村</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/common/reset.css">
  <link rel="stylesheet" href="/css/common/variables.css">
  <link rel="stylesheet" href="/css/common/typography.css">
  <link rel="stylesheet" href="/css/common/utilities.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/pages/login.css">
  <script src="/js/common/theme-loader.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-logo">福溪村</h1>
        <p class="auth-subtitle">找回密码</p>
      </div>

      <form id="forgot-form" onsubmit="return false;">
        <!-- 步骤 1：输入用户名 -->
        <div id="step-username">
          <div class="form-group">
            <label class="form-label">用户名或手机号</label>
            <input type="text" name="username" class="form-input" placeholder="请输入用户名或手机号" autocomplete="username">
          </div>

          <p class="form-hint" style="margin-bottom:16px;">
            输入用户名或手机号，系统将自动检测并发送密码重置链接。
          </p>

          <div class="turnstile-container" id="turnstile-container"></div>

          <button type="button" class="btn btn-primary btn-lg btn-block" id="btn-check" onclick="ForgotPassword.checkUsername()">下一步</button>
        </div>

        <!-- 步骤 2：无邮箱 → 验证手机号 -->
        <div id="step-phone" style="display:none;">
          <div style="background:var(--color-bg-hover);border-radius:var(--radius-base);padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--color-text-secondary);">
            该账号未绑定邮箱，请先验证注册时的手机号。<br>
            <span style="font-size:13px;color:var(--color-text-placeholder);">忘记注册手机号？请邮箱联系 <a href="mailto:www@fuxicun.top" style="color:var(--color-primary);">www@fuxicun.top</a></span>
          </div>

          <div class="form-group">
            <label class="form-label">注册时的手机号</label>
            <input type="tel" name="phone" class="form-input" placeholder="请输入注册时填写的手机号" autocomplete="tel">
          </div>

          <button type="button" class="btn btn-primary btn-lg btn-block" id="btn-verify" onclick="ForgotPassword.verifyPhone()">验证手机号</button>
        </div>

        <!-- 步骤 3：手机号验证通过 → 输入代收邮箱 -->
        <div id="step-email" style="display:none;">
          <div style="background:#e8f5e9;border-radius:var(--radius-base);padding:12px 16px;margin-bottom:16px;font-size:14px;color:#2e7d32;">
            ✓ 手机号验证通过，请输入接收重置链接的邮箱地址（可以是家人或朋友的邮箱，仅用于本次接收，不会绑定到您的账号）。
          </div>

          <div class="form-group">
            <label class="form-label">接收邮箱（一次性投递，不绑定）</label>
            <input type="email" name="recipient_email" class="form-input" placeholder="例如 yourfamily@example.com" autocomplete="email">
            <p style="font-size:12px;color:var(--color-text-placeholder);margin-top:4px;">如需正式绑定邮箱，请重置完成后登录到"个人中心 → 修改邮箱"自行设置。</p>
          </div>

          <button type="button" class="btn btn-primary btn-lg btn-block" id="btn-send" onclick="ForgotPassword.sendReset()">发送重置邮件</button>
        </div>

        <!-- 成功提示 -->
        <div id="step-success" style="display:none;text-align:center;padding:20px 0;">
          <p style="font-size:48px;margin-bottom:16px;">📧</p>
          <p id="success-message" style="color:var(--color-text-secondary);"></p>
          <p id="success-email" style="font-weight:600;margin:8px 0;font-size:16px;"></p>
          <p style="color:var(--color-text-placeholder);font-size:13px;margin-top:16px;">请在24小时内点击邮件中的链接重置密码</p>
          <a href="/login.html" class="btn btn-primary" style="margin-top:20px;">返回登录</a>
        </div>
      </form>

      <div class="auth-footer">
        <a href="/login.html" class="auth-link">← 返回登录</a>
      </div>
    </div>

    <a href="/" class="auth-back">← 返回首页</a>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/storage.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/toast.js"></script>
  <script src="/js/components/form.js"></script>
  <script src="/js/pages/forgot-password.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
