<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>修改密码 - 福溪村用户中心</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/css/common/reset.css">
  <link rel="stylesheet" href="/css/common/variables.css">
  <link rel="stylesheet" href="/css/common/typography.css">
  <link rel="stylesheet" href="/css/common/utilities.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/components/user-panel.css">
  <script src="/js/common/theme-loader.js"></script>
</head>
<body>
  <div class="user-panel-layout">
    <aside class="user-panel-sidebar" id="user-panel-sidebar"></aside>
    <div class="user-panel-main">
      <header class="user-panel-header" id="user-panel-header"></header>
      <main class="user-panel-content">
        <h2 style="font-size:20px;font-weight:600;margin-bottom:24px;">修改密码</h2>

        <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);max-width:480px;">
          <form id="password-form">
            <div class="form-group">
              <label class="form-label" for="old-password">当前密码</label>
              <input type="password" id="old-password" name="old_password" class="form-input" placeholder="请输入当前密码" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="new-password">新密码</label>
              <input type="password" id="new-password" name="new_password" class="form-input" placeholder="请输入新密码（至少8位）" required minlength="8">
            </div>
            <div class="form-group">
              <label class="form-label" for="confirm-password">确认新密码</label>
              <input type="password" id="confirm-password" name="confirm_password" class="form-input" placeholder="请再次输入新密码" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" id="btn-change-password">确认修改</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/storage.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/toast.js"></script>
  <script src="/js/components/user-panel.js"></script>
  <script src="/js/pages/user-password.js"></script>
</body>
</html>
