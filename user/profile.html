<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>个人资料 - 福溪村用户中心</title>
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/css/common/reset.css">
  <link rel="stylesheet" href="/css/common/variables.css">
  <link rel="stylesheet" href="/css/common/typography.css">
  <link rel="stylesheet" href="/css/common/utilities.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/components/user-panel.css">
  <script src="/js/common/theme-loader.js"></script>
</head>
<body>
  <div class="user-panel-layout">
    <aside class="user-panel-sidebar" id="user-panel-sidebar"></aside>
    <div class="user-panel-main">
      <header class="user-panel-header" id="user-panel-header"></header>
      <main class="user-panel-content">
        <h2 style="font-size:20px;font-weight:600;margin-bottom:24px;">个人资料</h2>

        <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:24px;">
          <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">头像</h3>
          <div style="display:flex;align-items:center;gap:20px;">
            <div id="avatar-preview" style="width:80px;height:80px;border-radius:50%;background:var(--color-primary);color:#fff;font-size:32px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">
              <img id="avatar-img" src="/images/default/avatar.svg" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
              <span id="avatar-initial">U</span>
            </div>
            <div>
              <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;">
              <button type="button" class="btn btn-outline" id="btn-upload-avatar">更换头像</button>
              <p style="font-size:13px;color:var(--color-text-secondary);margin-top:8px;">支持 JPG、PNG、WebP、GIF，最大 2MB</p>
            </div>
          </div>
        </div>

        <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);">
          <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">基本信息</h3>
          <form id="profile-form">
            <div class="form-group">
              <label class="form-label">显示名称</label>
              <input type="text" name="display_name" class="form-input" placeholder="设置显示名称（2-20个字符）">
              <p style="font-size:12px;color:var(--color-text-placeholder);margin-top:4px;">用于文章和评论中显示，留空则使用用户名</p>
            </div>
            <div class="form-group">
              <label class="form-label">用户名</label>
              <input type="text" name="username" class="form-input" disabled>
            </div>
            <div class="form-group">
              <label class="form-label">手机号</label>
              <input type="tel" name="phone" class="form-input" disabled>
            </div>
            <div class="form-group">
              <label class="form-label">邮箱</label>
              <input type="email" name="email" class="form-input" placeholder="请输入邮箱">
            </div>
            <button type="submit" class="btn btn-primary" id="btn-save-profile">保存修改</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/storage.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/toast.js"></script>
  <script src="/js/components/user-panel.js"></script>
  <script src="/js/pages/user-profile.js"></script>
</body>
</html>
