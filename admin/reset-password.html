<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>重置密码 - 福溪村后台</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/common/reset.css">
  <link rel="stylesheet" href="/css/common/variables.css">
  <link rel="stylesheet" href="/css/common/typography.css">
  <link rel="stylesheet" href="/css/common/utilities.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/components/modal.css">
  <link rel="stylesheet" href="/css/admin/admin-layout.css">
  <script src="/js/common/theme-loader.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-header" id="admin-header"></header>
      <main class="admin-content">
        <div style="max-width:600px;">
          <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);">
            <h2 style="font-size:20px;font-weight:600;margin-bottom:8px;">重置用户密码</h2>
            <p style="color:var(--color-text-secondary);font-size:14px;margin-bottom:24px;">
              输入用户名和接收邮箱，系统将向该邮箱发送密码重置链接。邮件中包含修改注册手机号的指引。
            </p>

            <div class="form-group">
              <label class="form-label">用户名</label>
              <input type="text" id="reset-username" class="form-input" placeholder="输入需要重置密码的用户名">
            </div>

            <div class="form-group">
              <label class="form-label">接收邮箱</label>
              <input type="email" id="reset-email" class="form-input" placeholder="输入接收重置链接的邮箱地址">
              <p style="font-size:12px;color:var(--color-text-placeholder);margin-top:4px;">重置链接将发送到此邮箱，用户点击后可设置新密码。</p>
            </div>

            <button class="btn btn-primary btn-lg" id="btn-reset" onclick="ResetPassword.send()">发送重置邮件</button>

            <div id="reset-result" style="display:none;margin-top:16px;padding:12px 16px;border-radius:var(--radius-base);font-size:14px;"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/storage.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/admin/admin.js"></script>
  <script>
  var ResetPassword = (function() {
    'use strict';

    async function send() {
      var username = (document.getElementById('reset-username').value || '').trim();
      var email = (document.getElementById('reset-email').value || '').trim();

      if (!username) { Toast.error('请输入用户名'); return; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Toast.error('请输入有效的邮箱地址'); return; }

      var btn = document.getElementById('btn-reset');
      btn.disabled = true;
      btn.textContent = '发送中...';

      try {
        var result = await API.post('/admin/reset-user-password', {
          username: username,
          email: email
        });

        var resultDiv = document.getElementById('reset-result');
        if (result.success) {
          resultDiv.style.display = '';
          resultDiv.style.background = '#e8f5e9';
          resultDiv.style.color = '#2e7d32';
          resultDiv.textContent = result.message || '重置链接已发送';
          document.getElementById('reset-username').value = '';
          document.getElementById('reset-email').value = '';
        } else {
          resultDiv.style.display = '';
          resultDiv.style.background = '#fce4ec';
          resultDiv.style.color = '#c62828';
          resultDiv.textContent = result.message || '发送失败';
        }
      } catch (e) {
        Toast.error(e.message || '发送失败');
      } finally {
        btn.disabled = false;
        btn.textContent = '发送重置邮件';
      }
    }

    return { send: send };
  })();
  </script>
</body>
</html>
