<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>首页配置 - 福溪村后台</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/common/reset.css">
  <link rel="stylesheet" href="/css/common/variables.css">
  <link rel="stylesheet" href="/css/common/typography.css">
  <link rel="stylesheet" href="/css/common/utilities.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/admin/admin-layout.css">
  <style>
    .module-list { display: flex; flex-direction: column; gap: 8px; }
    .module-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: #fff; border: 1px solid var(--color-border-light);
      border-radius: 8px; cursor: grab; transition: box-shadow 0.2s;
    }
    .module-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .module-item.dragging { opacity: 0.5; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .module-item__drag { cursor: grab; color: var(--color-text-placeholder); font-size: 18px; padding: 4px; }
    .module-item__icon { font-size: 20px; width: 32px; text-align: center; }
    .module-item__info { flex: 1; min-width: 0; }
    .module-item__title { font-weight: 600; font-size: 14px; }
    .module-item__subtitle { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
    .module-item__badge {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      background: var(--color-primary-bg); color: var(--color-primary);
    }
    .module-item__badge--inactive { background: #f5f5f5; color: var(--color-text-placeholder); }
    .module-item__actions { display: flex; gap: 4px; }
    .module-item__btn {
      padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer;
      font-size: 13px; background: transparent; color: var(--color-text-secondary);
    }
    .module-item__btn:hover { background: var(--color-bg-hover); }
    .module-item__btn--danger:hover { background: #fef2f2; color: #ef4444; }
    .module-item--fixed { cursor: default; background: var(--color-primary-bg); border-color: var(--color-primary); border-style: dashed; }

    .add-module-bar { margin-top: 16px; }
    .add-module-bar select { margin-right: 8px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal {
      background: #fff; border-radius: 12px; padding: 24px;
      width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto;
    }
    .modal__title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
    .modal__actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }

    .article-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .article-row select { flex: 1; }
    .article-row__remove {
      padding: 6px 8px; border: none; background: none; cursor: pointer;
      color: var(--color-text-placeholder); font-size: 16px;
    }
    .article-row__remove:hover { color: #ef4444; }

    .intro-card-row {
      display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start;
    }
    .intro-card-row input { flex: 1; }

    .travel-card-row {
      display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start;
    }
    .travel-card-row input { flex: 1; }

    .type-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
    }
    .type-option {
      padding: 16px; border: 2px solid var(--color-border-light); border-radius: 8px;
      text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .type-option:hover { border-color: var(--color-primary); }
    .type-option.selected { border-color: var(--color-primary); background: var(--color-primary-bg); }
    .type-option__icon { font-size: 24px; margin-bottom: 4px; }
    .type-option__label { font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-header" id="admin-header"></header>
      <main class="admin-content">
        <div class="admin-toolbar">
          <div class="admin-toolbar__left">
            <h2 style="font-size:18px;font-weight:600;">首页配置</h2>
          </div>
        </div>

        <p style="color:var(--color-text-secondary);font-size:13px;margin-bottom:16px;">
          拖拽调整模块顺序，点击编辑修改模块内容。模块更改后会实时反映在首页。
        </p>

        <div class="module-list" id="module-list"></div>

        <div style="margin-top:16px;">
          <button class="btn btn-primary" onclick="HomepageConfig.showAddModal()">+ 添加模块</button>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/storage.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js?v=2"></script>
  <script src="/js/common/toast.js"></script>
  <script src="/js/admin/admin.js"></script>
  <script src="/js/admin/homepage.js"></script>
</body>
</html>
