<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>数据库管理 - 福溪村后台</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/common/reset.css">
  <link rel="stylesheet" href="/css/common/variables.css">
  <link rel="stylesheet" href="/css/common/typography.css">
  <link rel="stylesheet" href="/css/common/utilities.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/components/modal.css">
  <link rel="stylesheet" href="/css/admin/admin-layout.css">
  <script src="/js/common/theme-loader.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-header" id="admin-header"></header>
      <main class="admin-content">
        <div style="max-width:800px;">
          <h2 style="font-size:20px;font-weight:600;margin-bottom:8px;">数据库管理</h2>
          <p style="color:var(--color-text-secondary);font-size:14px;margin-bottom:24px;">备份、恢复和重装网站数据。请谨慎操作危险功能。</p>

          <!-- 导出备份 -->
          <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
              <span style="font-size:28px;">📦</span>
              <div>
                <h3 style="font-size:16px;font-weight:600;">导出备份</h3>
                <p style="font-size:13px;color:var(--color-text-secondary);">JSON 格式用于后台导入恢复，SQL 格式用于 D1 控制台导入</p>
              </div>
            </div>
            <button class="btn btn-primary" id="btn-export" onclick="Database.exportBackup()">导出 JSON 备份</button>
            <button class="btn btn-outline" id="btn-export-sql" onclick="Database.exportBackup('sql')" style="margin-left:8px;">导出 SQL 备份</button>
          </div>

          <!-- 导入恢复 -->
          <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
              <span style="font-size:28px;">📥</span>
              <div>
                <h3 style="font-size:16px;font-weight:600;">导入恢复</h3>
                <p style="font-size:13px;color:var(--color-text-secondary);">上传备份文件恢复数据，当前数据将被覆盖</p>
              </div>
            </div>
            <input type="file" id="import-file" accept=".json" style="display:none;" onchange="Database.handleFileSelect(this)">
            <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">选择备份文件</button>
            <span id="import-filename" style="margin-left:12px;font-size:13px;color:var(--color-text-secondary);"></span>
          </div>

          <!-- 重置数据 -->
          <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:16px;border-left:4px solid #e74c3c;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
              <span style="font-size:28px;">🗑️</span>
              <div>
                <h3 style="font-size:16px;font-weight:600;">重置数据</h3>
                <p style="font-size:13px;color:var(--color-text-secondary);">清除所有内容数据，恢复为网站默认数据。管理员账号和安装管理密码保留不变。</p>
              </div>
            </div>
            <button class="btn btn-danger" onclick="Database.clearData()">重置数据</button>
          </div>

          <!-- 重装网站 -->
          <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border-left:4px solid #e74c3c;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
              <span style="font-size:28px;">⚠️</span>
              <div>
                <h3 style="font-size:16px;font-weight:600;">重新安装</h3>
                <p style="font-size:13px;color:var(--color-text-secondary);">清空所有数据并重新初始化为默认状态，当前管理员账号将保留</p>
              </div>
            </div>
            <button class="btn btn-danger" onclick="Database.reinstall()">重新安装网站</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/common/config.js"></script>
  <script src="/js/common/storage.js"></script>
  <script src="/js/common/utils.js"></script>
  <script src="/js/common/api.js"></script>
  <script src="/js/common/auth.js"></script>
  <script src="/js/common/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/admin/admin.js"></script>
  <script src="/js/admin/database.js"></script>
</body>
</html>
